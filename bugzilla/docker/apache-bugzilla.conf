ServerName localhost
ServerTokens Prod
ServerSignature Off

PerlSwitches -w -T
PerlConfigRequire /var/www/html/mod_perl.pl

# Access log without query strings: a query string can carry credentials or reset tokens.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined_no_query

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined_no_query
</VirtualHost>
