server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Match the BFF: attachments up to 60 MB, request headers up to 64 KB.
    client_max_body_size 64m;
    large_client_header_buffers 8 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Live updates: a long-lived Server-Sent Events stream - never buffer it.
    location = /api/events {
        proxy_pass http://bff:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://bff:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Excel and evidence-pack exports can take minutes.
        proxy_read_timeout 300s;
    }

    # Vite puts a content hash in every asset name, so assets can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path is a client-side route.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
